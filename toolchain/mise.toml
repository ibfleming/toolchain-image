# Single source of truth for the toolchain baked into the `ci` (and therefore `dev`) image.
# Exact versions only. Change via PR; regenerate the lock with `make lock`.
# Every entry needs a consumer and an owner (owner: ibfleming for all, for now).
# Explicit aqua backends: checksum-verified installs from upstream release assets.

[tools]
# --- infra ---------------------------------------------------- consumers: iac-proxmox, homelab
"aqua:opentofu/opentofu" = "1.13.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:helm/helm" = "4.3.0"
"aqua:derailed/k9s" = "0.51.0"

# --- python --------------------------------------------------- consumers: python projects
# 3.14 rather than the just-released 3.15.0: let the wheel ecosystem catch up first.
python = "3.14.8"
"aqua:astral-sh/ruff" = "0.17.0"
"aqua:astral-sh/uv" = "0.13.0"

# --- go ------------------------------------------------------- consumers: go-site
go = "1.27.2"

# --- c/c++ (compilers come from apt: build-essential, clang; see Dockerfile) -- consumers: native builds
"aqua:Kitware/CMake" = "4.4.4"
"aqua:ninja-build/ninja" = "1.13.2"

# --- node ----------------------------------------------------- consumers: web projects
# Active LTS line (24). Node 26 enters LTS late Oct 2026; move then.
node = "24.21.0"

[settings]
lockfile = true
# Precompiled CPython (python-build-standalone); never compile in the image build.
python.compile = false
# Keep npm as upstream ships it. mise's npm wrapper (for `mise reshim` after `npm -g`)
# resolves paths from its invocation dir and breaks when symlinked into /usr/local/bin.
node.npm_shim = false
