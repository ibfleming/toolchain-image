# Dev-only tools, installed into the `dev` image only (never `ci`). The shell's own tools
# (starship, fzf, eza, ...) are in ../shell/mise.toml. Same rules as ../mise.toml: exact versions,
# `make lock` regenerates mise.lock.

[tools]
# --- git
"aqua:jesseduffield/lazygit" = "0.66.2"
"aqua:jesseduffield/lazydocker" = "0.25.2"
"aqua:cli/cli" = "2.103.3"

# --- docker CLI plugins (the CLI itself comes from Docker's signed apt repo, see the Dockerfile)
"aqua:docker/buildx" = "0.38.0"
"aqua:docker/compose" = "5.6.0"

# --- kubernetes
"aqua:ahmetb/kubectx" = "0.11.0"
"aqua:ahmetb/kubectx/kubens" = "0.11.0"
"aqua:derailed/k9s" = "0.51.0"

# --- node (node and npm are in ../mise.toml)
"aqua:pnpm/pnpm" = "12.14.0"

# --- editor
"aqua:neovim/neovim" = "0.12.6"

[settings]
lockfile = true
