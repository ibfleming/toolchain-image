# Tools for working ON this repo (lint/format/test the image), not tools baked INTO it.
# The image's toolchain manifest is toolchain/mise.toml.
[tools]
hadolint = "2.15.1"
container-structure-test = "1.22.1"
# 3.x: the binary is `ec`. 4.x needs a newer mise registry than the one on the WSL host.
editorconfig-checker = "3.11.3"
shfmt = "3.14.1"
shellcheck = "0.11.0"
taplo = "0.10.0"
# prettier runs on node; same node version as the image toolchain.
node = "24.21.0"
"npm:prettier" = "3.9.10"
