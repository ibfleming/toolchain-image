# git-cliff: changelog and release notes generated from Conventional Commits.
# `make changelog` writes CHANGELOG.md; the release workflow uses the latest section as notes.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project. Generated by [git-cliff](https://git-cliff.org) from
[Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
{% if commits | length == 0 %}
Rebuild only: no source changes. Picks up base image and OS package updates.
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^build", group = "<!-- 4 -->Build and dependencies" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^(chore|style)", group = "<!-- 9 -->Maintenance" },
]
