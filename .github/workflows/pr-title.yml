# PRs are squash-merged and the PR title becomes the commit on main, so the title must follow
# Conventional Commits. Separate from ci.yml so editing a title re-checks it without a rebuild.
name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# Every run step in bash with -e and pipefail ("bash" makes GitHub add -o pipefail; the implicit
# default doesn't), so a failure inside a pipe (e.g. `script | tee -a "$GITHUB_OUTPUT"`) fails the
# step instead of being masked by the last command.
defaults:
  run:
    shell: bash

# One group per PR: a title edit or a push cancels the superseded check.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit-title:
    name: Conventional Commit Title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the Runner (Egress Allowlist)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Observed in audit mode (cold and warm mise caches): GitHub, and what mise and
          # mise-action fetch (mise itself, tool downloads, Node.js and npm for the npm tools,
          # Sigstore TUF and OSV for verification). Actions' own result storage is allowed
          # implicitly. A new tool host after an update fails the job with the blocked domain in
          # the annotations: add it here.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            api.npmjs.org:443
            registry.npmjs.org:443
            npm.jsr.io:443
            nodejs.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            endevco.github.io:443
            api.osv.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tools (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Lint PR Title
        env:
          TITLE: ${{ github.event.pull_request.title }} # via env, never interpolated into the script
        run: make check-pr-title
