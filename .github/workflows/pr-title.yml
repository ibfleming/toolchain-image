# PRs are squash-merged and the PR title becomes the commit on main, so the title must follow
# Conventional Commits. Separate from ci.yml so editing a title re-checks it without a rebuild.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# Every run step in bash with -e and pipefail ("bash" makes GitHub add -o pipefail; the implicit
# default doesn't), so a failure inside a pipe (e.g. `script | tee -a "$GITHUB_OUTPUT"`) fails the
# step instead of being masked by the last command.
defaults:
  run:
    shell: bash

jobs:
  conventional-commit-title:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }} # via env, never interpolated into the script
        run: make check-pr-title
