# OpenSSF Scorecard: rates the repository's security practices (pinning, token permissions, branch
# protection, signed releases, ...) and publishes the result to the OpenSSF API for the README
# badge. Findings also go to code scanning (Security tab).
#
# Publishing makes the Scorecard API check this workflow, and it rejects results unless: no
# top-level env or defaults, no workflow-level write permissions, id-token only for this job, and
# only actions from its approved list in this job (so no `run:` steps).
# https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  push:
    branches: [main]
  # Re-score after a change to branch protection (Branch-Protection check).
  branch_protection_rule:
  # Weekly, so the Maintained check stays current. Off the hour (scheduled runs at the top of the
  # hour are delayed or dropped first).
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
      security-events: write # results to code scanning
      id-token: write # publish results (OIDC) for the badge
    steps:
      - name: Harden the Runner (Egress Audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the Results (5 Days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
          if-no-files-found: error
      - name: Results to Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
