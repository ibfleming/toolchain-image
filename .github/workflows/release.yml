# Release: build once, test the exact pushed digests, gate, promote by digest copy, sign,
# verify, publish a GitHub Release. Runs on a vX.Y.Z tag, weekly (patch rebuild picks up
# Debian security updates), or manually. See docs/design/image-family-and-supply-chain.md §5-6.
name: release

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    # Mondays 12:23 UTC. Off the hour on purpose: GitHub delays scheduled runs under load, most
    # at the top of the hour, and can drop them entirely (the first 12:00 UTC run never started).
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # tag (scheduled runs) + GitHub Release
      packages: write # push staging/release images, registry cache
      id-token: write # keyless signing (Sigstore, GitHub OIDC)
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/toolchain
      CACHE_REF: ghcr.io/${{ github.repository_owner }}/toolchain/buildcache
      CACHE_TO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for versioning
          # The write token stays out of .git/config while the build and tests run; only the tag
          # push below gets it.
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A release holds more than CI (its build cache until pushed, then both pulled images, then
      # Trivy's exports), so it keeps the full cleanup's headroom.
      - name: Disk space (images are ~2 GB each; Trivy exports them again)
        run: scripts/free_disk.sh 30

      - name: Version
        id: version
        run: scripts/release_version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Previous release (what changed, for the dev image's welcome)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/previous_tools.sh "$VERSION" | tee -a "$GITHUB_ENV"

      - name: Build and push to staging (SBOM + provenance)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make builder
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export APT_REFRESH="${{ github.run_id }}-${{ github.run_attempt }}" # current Debian packages
          docker buildx bake --builder toolchain --push --metadata-file bake-meta.json ci dev
          ci="$(jq -er '.ci["containerimage.digest"]' bake-meta.json)"
          dev="$(jq -er '.dev["containerimage.digest"]' bake-meta.json)"
          { echo "CI_DIGEST=$ci"; echo "DEV_DIGEST=$dev"; } >> "$GITHUB_ENV"
          docker buildx prune --builder toolchain --all --force >/dev/null # pushed; drop local build cache

      - name: Test the pushed digests
        run: |
          # Both at once; each pull's failure still fails the step.
          docker pull -q "$REGISTRY/staging/ci@$CI_DIGEST" & ci_pull=$!
          docker pull -q "$REGISTRY/staging/dev@$DEV_DIGEST" & dev_pull=$!
          wait "$ci_pull"
          wait "$dev_pull"
          docker tag "$REGISTRY/staging/ci@$CI_DIGEST" toolchain/ci:local
          docker tag "$REGISTRY/staging/dev@$DEV_DIGEST" toolchain/dev:local
          make -j "$(nproc)" --output-sync=target test

      - name: Vulnerability gate
        run: |
          # Scan the pulled release digests by their real references (labels in the report).
          # Every image is scanned; the step fails if any of them fails the gate.
          set -o pipefail
          (
            rc=0
            for ref in "$REGISTRY/staging/ci@$CI_DIGEST" "$REGISTRY/staging/dev@$DEV_DIGEST"; do
              scripts/scan.sh "$ref" || rc=1
            done
            exit "$rc"
          ) | tee scan.md

      - name: Promote by digest copy
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          minor="${VERSION%.*}" major="${VERSION%%.*}"
          for t in ci dev; do
            d="$CI_DIGEST"; [[ $t == dev ]] && d="$DEV_DIGEST"
            docker buildx imagetools create \
              -t "$REGISTRY/$t:$VERSION" -t "$REGISTRY/$t:$minor" -t "$REGISTRY/$t:$major" \
              "$REGISTRY/staging/$t@$d"
            # A single-source copy must preserve the digest (signatures/attestations follow it).
            got="$(docker buildx imagetools inspect "$REGISTRY/$t:$VERSION" --format '{{json .Manifest}}' \
              | jq -r .digest)"
            [[ $got == "$d" ]] || { echo "digest changed on promote: $got != $d" >&2; exit 1; }
          done

      - name: Sign (keyless) and verify
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          for ref in "$REGISTRY/ci@$CI_DIGEST" "$REGISTRY/dev@$DEV_DIGEST"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "signed + verified: $ref"
          done

      - name: Tag scheduled/manual release
        if: steps.version.outputs.new_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          # For this push only, as actions/checkout passes it: a header, never in a URL or on disk.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "$TAG"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          # This release's changes: from the previous tag to this one (it exists by now, pushed or
          # created above). Not --latest: a weekly rebuild tags the same commit as the previous
          # release, and git-cliff would then report everything since the release before that.
          prev="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude "$TAG" "$TAG" 2>/dev/null || true)"
          if [[ -n $prev ]]; then git-cliff "$prev..$TAG" --strip all > changes.md
          else git-cliff --latest --strip all > changes.md; fi
          git-cliff --output CHANGELOG.md
          scripts/release_notes.sh > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          # The consumer template with this release's dev image filled in.
          scripts/render_template.sh "$REGISTRY/dev:$VERSION@$DEV_DIGEST" template.tar.gz
          gh release create "$TAG" CHANGELOG.md template.tar.gz --title "$TAG" --notes-file notes.md \
            --verify-tag
