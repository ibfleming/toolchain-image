# Release: build once, test the exact pushed digests, gate, promote by digest copy, sign,
# verify, publish a GitHub Release. Runs on a vX.Y.Z tag, weekly (patch rebuild picks up
# Debian security updates), or manually. See docs/design/image-family-and-supply-chain.md §5-6.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    # Mondays 12:23 UTC. Off the hour on purpose: GitHub delays scheduled runs under load, most
    # at the top of the hour, and can drop them entirely (the first 12:00 UTC run never started).
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions: {}

# Every run step in bash with -e and pipefail ("bash" makes GitHub add -o pipefail; the implicit
# default doesn't), so a failure inside a pipe (e.g. `script | tee -a "$GITHUB_OUTPUT"`) fails the
# step instead of being masked by the last command.
defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Test, Sign and Publish
    runs-on: ubuntu-26.04
    # Longest run on record ~12 min; a base-digest bump rebuilds everything cold.
    timeout-minutes: 60
    permissions:
      contents: write # tag (scheduled runs) + GitHub Release
      packages: write # push staging/release images, registry cache
      id-token: write # keyless signing (Sigstore, GitHub OIDC)
      attestations: write # build provenance of the release assets
      security-events: write # vulnerability findings to code scanning (Security tab)
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/toolchain
      CACHE_REF: ghcr.io/${{ github.repository_owner }}/toolchain/buildcache
      CACHE_TO: "1"
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for versioning
          # The write token stays out of .git/config while the build and tests run; only the tag
          # push below gets it.
          persist-credentials: false
      # No tool cache in a publishing workflow: a poisoned cache entry (written by any run that can
      # write caches) would otherwise reach the signed release. Costs about a minute of installs.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A release holds more than CI (its build cache until pushed, then both pulled images, then
      # Trivy's exports), so it keeps the full cleanup's headroom.
      - name: Disk space (images are ~2 GB each; Trivy exports them again)
        run: scripts/free_disk.sh 30

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }} # does the newest tag already have a release? (re-runs)
        run: scripts/release_version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Previous release (what changed, for the dev image's welcome)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/previous_tools.sh "$VERSION" | tee -a "$GITHUB_ENV"

      - name: Build and push to staging (SBOM + provenance)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make builder
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          export APT_REFRESH="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" # current Debian packages
          docker buildx bake --builder toolchain --push --metadata-file bake-meta.json ci dev
          ci="$(jq -er '.ci["containerimage.digest"]' bake-meta.json)"
          dev="$(jq -er '.dev["containerimage.digest"]' bake-meta.json)"
          { echo "CI_DIGEST=$ci"; echo "DEV_DIGEST=$dev"; } >> "$GITHUB_ENV"
          docker buildx prune --builder toolchain --all --force >/dev/null # pushed; drop local build cache

      - name: Test the pushed digests
        run: |
          # Both at once; each pull's failure still fails the step.
          docker pull -q "$REGISTRY/staging/ci@$CI_DIGEST" & ci_pull=$!
          docker pull -q "$REGISTRY/staging/dev@$DEV_DIGEST" & dev_pull=$!
          wait "$ci_pull"
          wait "$dev_pull"
          docker tag "$REGISTRY/staging/ci@$CI_DIGEST" toolchain/ci:local
          docker tag "$REGISTRY/staging/dev@$DEV_DIGEST" toolchain/dev:local
          make -j "$(nproc)" --output-sync=target test

      - name: Vulnerability gate
        run: |
          # Scan the pulled release digests by their real references (labels in the report).
          # Every image is scanned; the step fails if any of them fails the gate. The same findings
          # go to sarif/<image>.sarif for code scanning.
          set -o pipefail
          mkdir -p sarif
          (
            rc=0
            SCAN_SARIF=sarif/ci.sarif scripts/scan.sh "$REGISTRY/staging/ci@$CI_DIGEST" || rc=1
            SCAN_SARIF=sarif/dev.sarif scripts/scan.sh "$REGISTRY/staging/dev@$DEV_DIGEST" || rc=1
            exit "$rc"
          ) | tee scan.md

      # Code scanning tracks the default branch, so only runs on main (weekly and manual releases)
      # upload; a tag push releases a commit those runs also scan. Uploaded even when the gate
      # fails, so the blocking findings show up in the Security tab.
      - name: Vulnerability findings to code scanning (ci)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('sarif/ci.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/ci.sarif
          category: trivy-ci
      - name: Vulnerability findings to code scanning (dev)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('sarif/dev.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/dev.sarif
          category: trivy-dev

      - name: Promote by digest copy
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          minor="${VERSION%.*}" major="${VERSION%%.*}"
          for t in ci dev; do
            d="$CI_DIGEST"; [[ $t == dev ]] && d="$DEV_DIGEST"
            docker buildx imagetools create \
              -t "$REGISTRY/$t:$VERSION" -t "$REGISTRY/$t:$minor" -t "$REGISTRY/$t:$major" \
              "$REGISTRY/staging/$t@$d"
            # A single-source copy must preserve the digest (signatures/attestations follow it).
            got="$(docker buildx imagetools inspect "$REGISTRY/$t:$VERSION" --format '{{json .Manifest}}' \
              | jq -r .digest)"
            [[ $got == "$d" ]] || { echo "digest changed on promote: $got != $d" >&2; exit 1; }
          done

      - name: Sign (keyless) and verify
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          for ref in "$REGISTRY/ci@$CI_DIGEST" "$REGISTRY/dev@$DEV_DIGEST"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "signed + verified: $ref"
          done

      - name: Tag scheduled/manual release
        if: ${{ steps.version.outputs.new_tag == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          # For this push only, as actions/checkout passes it: a header, never in a URL or on disk.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "$TAG"

      - name: Release notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          # This release's changes: from the previous tag to this one (it exists by now, pushed or
          # created above). Not --latest: a weekly rebuild tags the same commit as the previous
          # release, and git-cliff would then report everything since the release before that.
          prev="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude "$TAG" "$TAG" 2>/dev/null || true)"
          if [[ -n $prev ]]; then git-cliff "$prev..$TAG" --strip all > changes.md
          else git-cliff --latest --strip all > changes.md; fi
          git-cliff --output CHANGELOG.md
          scripts/release_notes.sh > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          # The consumer template with this release's dev image filled in.
          scripts/render_template.sh "$REGISTRY/dev:$VERSION@$DEV_DIGEST" template.tar.gz

      # Signed SLSA build provenance for the release assets (the images carry their own, from
      # BuildKit). Attached as <tag>.intoto.jsonl, the name OpenSSF Scorecard's Signed-Releases
      # check looks for; `gh attestation verify --bundle` checks it (README: Verify an image).
      - name: Provenance for the release assets
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            template.tar.gz
            CHANGELOG.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$TAG.intoto.jsonl"
          gh release create "$TAG" CHANGELOG.md template.tar.gz "$TAG.intoto.jsonl" --title "$TAG" \
            --notes-file notes.md --verify-tag
