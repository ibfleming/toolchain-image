# CI gate for every push to main and every PR: formatting/lint and Conventional Commits on
# pushed commits (PR titles are checked by pr-title.yml), then build both images and run the
# full test suite, spelling and the vulnerability gate. Same `make` targets as on a laptop.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every run step in bash with -e and pipefail ("bash" makes GitHub add -o pipefail; the implicit
# default doesn't), so a failure inside a pipe (e.g. `script | tee -a "$GITHUB_OUTPUT"`) fails the
# step instead of being masked by the last command.
defaults:
  run:
    shell: bash

# PRs: one group per branch, so a new push cancels the superseded run.
# main: one group per commit (SHA), so every commit on main gets a complete run; a shared
# group would still drop older *pending* runs even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Formatting and lint
        run: make lint
      - name: Conventional Commits (pushed commits)
        if: github.event_name == 'push'
        env:
          COMMITS_FROM: ${{ github.event.before }}
        run: make check-commits

  build-test:
    runs-on: ubuntu-26.04
    permissions:
      actions: read # find the last release run, whose build cache CI reuses
      contents: read
      packages: read # read the release pipeline's registry build cache
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/toolchain
      CACHE_REF: ghcr.io/${{ github.repository_owner }}/toolchain/buildcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A run uses ~7 GB (images, then Trivy's export of dev); runners start with ~15 GB free.
      - name: Disk space (images are ~2 GB each; Trivy exports them again)
        run: scripts/free_disk.sh 20
      # The release builds with APT_REFRESH=<run id>-<attempt> to fetch current Debian packages, and
      # pushes its build cache. Using the last release's value here matches that cache, so CI
      # rebuilds only the layers a change touches, on that release's packages (refreshed by every
      # release, at least weekly); the release gate still scans freshly built images.
      - name: Reuse the last release's build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --status success \
            --limit 1 --json databaseId,attempt -q '.[0] | "\(.databaseId)-\(.attempt)"' || true)"
          [[ $key == null-null ]] && key=""
          echo "APT_REFRESH=${key}" >> "$GITHUB_ENV"
          echo "APT_REFRESH=${key:-<none: no release yet>}"
      - name: Build ci + dev (local)
        env:
          GITHUB_TOKEN: ${{ github.token }} # BuildKit secret for mise downloads, never a build arg
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          make build
          docker buildx prune --builder toolchain --all --force >/dev/null # images are loaded; drop build cache
          df -h /
      - name: Test
        run: |
          make -j "$(nproc)" --output-sync=target test
          df -h /
      - name: Spelling
        run: make spell
      # dev is built FROM ci and only adds to it, so scanning dev covers ci's packages too.
      # Releases scan both.
      - name: Vulnerability gate
        run: make scan SCAN_IMGS=toolchain/dev:local >> "$GITHUB_STEP_SUMMARY"
      - name: Disk use
        if: always()
        run: df -h /
