# CI gate for every push to main and every PR: formatting/lint and Conventional Commits on
# pushed commits (PR titles are checked by pr-title.yml), then build both images and run the
# full test suite and the vulnerability gate on amd64 and arm64 (native runners), plus spelling.
# Same `make` targets as on a laptop.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # re-run main without an empty commit

permissions:
  contents: read

# Every run step in bash with -e and pipefail ("bash" makes GitHub add -o pipefail; the implicit
# default doesn't), so a failure inside a pipe (e.g. `script | tee -a "$GITHUB_OUTPUT"`) fails the
# step instead of being masked by the last command.
defaults:
  run:
    shell: bash

# PRs: one group per branch, so a new push cancels the superseded run.
# main: one group per commit (SHA), so every commit on main gets a complete run; a shared
# group would still drop older *pending* runs even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the Runner (Egress Allowlist)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Observed in audit mode (cold and warm mise caches): GitHub, and what mise and
          # mise-action fetch (mise itself, tool downloads, Node.js and npm for the npm tools,
          # Sigstore TUF and OSV for verification). Actions' own result storage is allowed
          # implicitly. A new tool host after an update fails the job with the blocked domain in
          # the annotations: add it here.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            api.npmjs.org:443
            registry.npmjs.org:443
            npm.jsr.io:443
            nodejs.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            endevco.github.io:443
            api.osv.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Tools (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # Online jactionlint rules (impostor commits, version comments vs. pinned SHAs, known-vulnerable
      # actions) need the GitHub API; a local `make lint` stays offline.
      - name: Formatting and Lint
        env:
          JACTIONLINT_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint
      - name: Conventional Commits (Pushed Commits)
        if: ${{ github.event_name == 'push' }}
        env:
          COMMITS_FROM: ${{ github.event.before }}
        run: make check-commits

  # One job per architecture, each on a native runner (no emulation): both images are built and the
  # full suite runs on amd64 and arm64.
  build-test:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    # Builds without a cache (a cold arm64 job takes ~4 min; only releases keep a build cache), so a
    # run takes the same time whatever changed.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden the Runner (Egress Audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tools (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # A run uses ~7 GB (images, then Trivy's export of dev); runners start with ~15 GB free.
      - name: Disk Space (Images Are ~2 GB Each; Trivy Exports Them Again)
        run: scripts/free_disk.sh 20
      - name: Build ci + dev (Local)
        env:
          GITHUB_TOKEN: ${{ github.token }} # BuildKit secret for mise downloads, never a build arg
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          make build
          docker buildx prune --builder toolchain --all --force >/dev/null # images are loaded; drop build cache
          df -h /
      - name: Spelling
        if: ${{ matrix.arch == 'amd64' }} # the same files on both
        run: make spell
      # The full suite, sizes and the vulnerability gate, as the release runs them. dev is built
      # FROM ci and only adds to it, so scanning dev covers ci's packages too; releases scan both.
      - name: Test, Size Report and Vulnerability Gate
        uses: $/.github/actions/smoke-test
        with:
          ci-image: toolchain/ci:local
          dev-image: toolchain/dev:local
          scan: "true"
      - name: Disk Use
        if: ${{ always() }}
        run: df -h /
