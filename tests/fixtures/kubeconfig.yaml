# Fake kubeconfig for testing the starship kubernetes segment (and k9s/kubectx UX) without a cluster.
# Every server is https://127.0.0.1:1 (always refused), so nothing can reach a real host even if
# something tries to connect. (.invalid names are not safe: some LAN resolvers answer them.)
# Contains no real credentials.
apiVersion: v1
kind: Config
current-context: homelab
clusters:
  - name: homelab
    cluster: { server: "https://127.0.0.1:1" }
  - name: staging
    cluster: { server: "https://127.0.0.1:1" }
  - name: prod-us-east
    cluster: { server: "https://127.0.0.1:1" }
  - name: payments
    cluster: { server: "https://127.0.0.1:1" }
  - name: analytics
    cluster: { server: "https://127.0.0.1:1" }
users:
  - name: demo
    user: { token: "not-a-real-token" }
contexts:
  - name: homelab
    context: { cluster: homelab, user: demo, namespace: monitoring }
  - name: staging
    context: { cluster: staging, user: demo }
  - name: prod-us-east
    context: { cluster: prod-us-east, user: demo, namespace: payments }
  - name: arn:aws:eks:us-east-1:123456789012:cluster/payments-api
    context: { cluster: payments, user: demo, namespace: default }
  - name: gke_acme-data-123_us-central1_analytics-main
    context: { cluster: analytics, user: demo }
