# Contract for the `dev` image. Runs in addition to the ci contract's tool checks
# (parity.sh enforces ci ⊆ dev for the toolchain itself).
schemaVersion: 2.0.0

metadataTest:
  entrypoint: []
  envVars:
    - key: CLAUDE_CONFIG_DIR
      value: /home/vscode/.claude
  labels:
    - key: devcontainer.metadata
      value: '.*"remoteUser":"vscode".*'
      isRegex: true

commandTests:
  - name: vscode has passwordless sudo (dev container convention)
    command: su
    args: [vscode, -c, "sudo -n true && echo ok"]
    expectedOutput: ["\\Aok\\n?\\z"]

  - name: vscode can read the managed policy (dirs must be searchable)
    command: su
    args: [vscode, -c, "cat /etc/claude-code/managed-settings.json"]
    expectedOutput: ['"disableBypassPermissionsMode": "disable"']

  - name: a planted ~/.local/bin/gh cannot shadow the real one (user bins are last on PATH)
    command: su
    args:
      - vscode
      - -c
      - >-
        mkdir -p ~/.local/bin && printf '#!/bin/sh\necho FAKE\n' > ~/.local/bin/gh
        && chmod +x ~/.local/bin/gh && zsh -i -c 'gh --version'
    expectedOutput: ["\\Agh version [0-9]+"]
    excludedOutput: ["FAKE"]

  - name: no Claude Code CLI in the image (the VS Code extension brings its own)
    command: bash
    args: ["-c", "command -v claude || echo none"]
    expectedOutput: ["\\Anone\\n?\\z"]

  - name: dev conveniences present
    command: which
    args: [zsh, gdb, less, ssh, ps, vi]

  - name: exactly one regular user, vscode at 1000:1000
    command: bash
    args: ["-c", "grep -E '^[^:]*:[^:]*:([1-9][0-9]{3}|[1-5][0-9]{4}):' /etc/passwd | cut -d: -f1,3,4"]
    expectedOutput: ["\\Avscode:1000:1000\\n?\\z"]

  - name: everything in the vscode home is owned by vscode
    command: find
    args: [/home/vscode, -not, -user, vscode]
    excludedOutput: [".+"]

  - name: login shell is zsh
    command: getent
    args: [passwd, vscode]
    expectedOutput: [":/usr/bin/zsh\\n?\\z"]

  - name: interactive zsh starts cleanly as vscode (no errors on stderr)
    command: su
    args: [vscode, -c, "zsh -i -c 'print -r -- ok'"]
    expectedOutput: ["\\Aok\\n?\\z"]
    excludedError: [".+"]

  - name: zsh plugins and generated completions are loaded
    command: su
    args:
      [
        vscode,
        -c,
        "zsh -i -c 'whence -w _zsh_highlight _zsh_autosuggest_start fzf-tab-complete _kubectl _helm _k9s _gh'",
      ]
    expectedOutput:
      - "_zsh_highlight: function"
      - "_zsh_autosuggest_start: function"
      - "fzf-tab-complete: function"
      - "_kubectl: function"
      - "_helm: function"
      - "_k9s: function"
      - "_gh: function"

  - name: welcome renders build metadata and tool pins (plain mode, as vscode)
    command: su
    args: [vscode, -c, "zsh -i -c 'welcome --plain'"]
    expectedOutput:
      - "dev  v\\d+\\.\\d+\\.\\d+"
      - "kubectl \\d+\\.\\d+\\.\\d+"
      - "gh \\d+\\.\\d+\\.\\d+"
    excludedOutput: ["\\x1b", "%F"]
    excludedError: [".+"]

  - name: welcome tools lists every pin, welcome keys the shortcuts (plain mode, as vscode)
    command: su
    args: [vscode, -c, "zsh -i -c 'welcome tools --plain; welcome keys --plain'"]
    expectedOutput:
      - "tools pinned"
      - "cli \\d+\\.\\d+\\.\\d+"
      - "kubens \\d+"
      - "gpf push --lease"
      - "Esc Esc sudo"
    excludedOutput: ["\\x1b", "%F"]
    excludedError: [".+"]

  - name: the prompt marks a container shell (Docker-blue first segment, whale), as vscode
    command: su
    args:
      - vscode
      - -c
      - >-
        cd /tmp && STARSHIP_SHELL=
        STARSHIP_CONFIG=/usr/local/share/toolchain/starship/starship.toml starship prompt
    expectedOutput: ["48;2;36;150;237[;m]", "\uf308 vscode"]
    excludedOutput: ["48;2;209;154;102[;m]"]
    excludedError: [".+"]

  - name: welcome rejects unknown arguments
    command: su
    args: [vscode, -c, "zsh -i -c 'welcome --bogus'"]
    exitCode: 2
    expectedError: ["unknown argument"]

fileExistenceTests:
  - name: sudoers grant for vscode
    path: /etc/sudoers.d/vscode
    shouldExist: true
    permissions: "-r--r-----"
  - name: managed policy is root-owned, world-readable
    path: /etc/claude-code/managed-settings.json
    shouldExist: true
    permissions: "-rw-r--r--"
    uid: 0
  - name: build metadata for welcome (release and tool versions)
    path: /etc/toolchain/release
    shouldExist: true
    permissions: "-rw-r--r--"
    uid: 0
  - name: pinned tool versions for welcome
    path: /etc/toolchain/versions
    shouldExist: true
    permissions: "-rw-r--r--"
    uid: 0
  - name: previous release's tools for welcome (empty in local builds)
    path: /etc/toolchain/previous
    shouldExist: true
    permissions: "-rw-r--r--"
    uid: 0
  - name: personal mise data dir pre-created for the volume (vscode)
    path: /home/vscode/.local/share/mise
    shouldExist: true
    uid: 1000
  - name: shell tools manifest
    path: /etc/mise/shell/mise.toml
    shouldExist: true
    permissions: "-rw-r--r--"
  - name: claude config dir pre-created for the volume (vscode, 0700)
    path: /home/vscode/.claude
    shouldExist: true
    permissions: "drwx------"
    uid: 1000

fileContentTests:
  - name: managed policy disables bypass mode and denies secret reads
    path: /etc/claude-code/managed-settings.json
    expectedContents:
      - '"disableBypassPermissionsMode": "disable"'
      - 'Read\(~/\.ssh/\*\*\)'
      - 'Read\(//\*\*/\.env\)'
