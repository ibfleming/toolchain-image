# Tools for working ON this repo (lint/format/test the image), not tools baked INTO it.
# The image's toolchain manifest is toolchain/mise.toml.
[tools]
hadolint = "2.15.1"
container-structure-test = "1.22.1"
# Binary is `editorconfig-checker` (4.x registry) or `ec` (older); the Makefile resolves either.
editorconfig-checker = "4.0.2"
shfmt = "3.14.1"
shellcheck = "0.11.0"
taplo = "0.10.0"
# release pipeline: vulnerability gate + keyless signing (also usable locally: make scan)
trivy = "0.76.0"
cosign = "3.1.3"
# prettier runs on node; same node version as the image toolchain.
node = "24.22.0"
# Changelog + release notes from Conventional Commits (`make changelog`, release workflow).
git-cliff = "2.14.2"
# Conventional Commits 1.0.0 linting (`make check-commits`, PR titles in CI).
"npm:@commitlint/cli" = "21.2.3"
"npm:@commitlint/config-conventional" = "21.2.3"
# Markdown lint (structure, lists, headings, tables); prettier formats, this checks.
"npm:markdownlint-cli2" = "0.23.3"
"npm:prettier" = "3.9.10"
