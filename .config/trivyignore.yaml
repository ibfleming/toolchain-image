# Time-boxed exceptions to the vulnerability gate (scripts/scan.sh).
#
# Only for findings we can't fix: a CVE in a third-party prebuilt binary whose
# upstream has no release with the fix yet. Each entry names the exact
# binary (its path includes the version, so a version bump re-checks it), says
# why, and expires: after expired_at the finding blocks again, so it gets
# looked at instead of forgotten. Suppressed findings stay in every scan
# report. Never use this for Debian packages or for tools we pin a fixed
# version of: bump those instead.

vulnerabilities:
  # Go standard library, fixed in Go 1.26.9 and 1.27.2. These four have no
  # release built with either yet (checked 2026-10-29); the other affected
  # tools (gh, tofu, kubectl, buildx, compose) are fixed by version bumps.
  - id: CVE-2026-56857
    paths:
      - opt/mise/installs/aqua-derailed-k9s/0.51.0/k9s
      - opt/mise/installs/aqua-ahmetb-kubectx/0.11.0/kubectx
      - opt/mise/installs/aqua-ahmetb-kubectx-kubens/0.11.0/kubens
      - opt/mise/installs/aqua-jesseduffield-lazydocker/0.25.2/lazydocker
    expired_at: 2026-11-30
    statement: upstream has no release built with a fixed Go yet
